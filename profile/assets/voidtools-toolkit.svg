<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="776" viewBox="0 0 1000 776" role="img" aria-label="VoidTools toolkit: System, Everyday, Entertainment, Utilities, Research and Personalization."><text x="0" y="34" fill="#f0f0f3" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="650" >A few things you can do.</text><rect x="1" y="65" width="488" height="222" rx="27" fill="#17181d" stroke="#292a32"/><text x="26" y="98" fill="#8e8f9a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2">01 / SYSTEM</text><text x="26" y="143" fill="#ededf2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" >Keep your PC in check.</text><text x="26" y="181" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >CPU, memory, disk and network.</text><text x="26" y="207" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >Maintenance and preview-first cleanup.</text><text x="26" y="256" fill="#787a88" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" >Dashboard · Win Optimizer · Clean Master</text><rect x="511" y="65" width="488" height="222" rx="27" fill="#17181d" stroke="#292a32"/><text x="536" y="98" fill="#8e8f9a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2">02 / EVERYDAY</text><text x="536" y="143" fill="#ededf2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" >Find your flow.</text><text x="536" y="181" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >Notes, clipboard history, app shortcuts</text><text x="536" y="207" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >and folder rules. Right where you need them.</text><text x="536" y="256" fill="#787a88" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" >VoidNotes · Vlipboard · VoidLauncher · VoidWatch</text><rect x="1" y="307" width="488" height="222" rx="27" fill="#17181d" stroke="#292a32"/><text x="26" y="340" fill="#8e8f9a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2">03 / ENTERTAINMENT</text><text x="26" y="385" fill="#ededf2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" >Make yourself at home.</text><text x="26" y="423" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >Find your next game. Open your screening</text><text x="26" y="449" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >room. Give your music a place to live.</text><text x="26" y="498" fill="#787a88" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" >Game Library · VoidStream · VoidPlayer</text><rect x="511" y="307" width="488" height="222" rx="27" fill="#17181d" stroke="#292a32"/><text x="536" y="340" fill="#8e8f9a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2">04 / UTILITIES</text><text x="536" y="385" fill="#ededf2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" >Keep the essentials close.</text><text x="536" y="423" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >Temporary inboxes, file encryption</text><text x="536" y="449" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >and a Discord presence you can make yours.</text><text x="536" y="498" fill="#787a88" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" >Temp Mail · VoidLock · VoidRPC</text><rect x="1" y="549" width="488" height="222" rx="27" fill="#17181d" stroke="#292a32"/><text x="26" y="582" fill="#8e8f9a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2">05 / RESEARCH</text><text x="26" y="627" fill="#ededf2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" >Stay curious.</text><text x="26" y="665" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >Explore public information, inspect</text><text x="26" y="691" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >websites and work with Lua scripts.</text><text x="26" y="740" fill="#787a88" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" >OSINT · Website Scan · Lua Tools</text><rect x="511" y="549" width="488" height="222" rx="27" fill="#17181d" stroke="#292a32"/><text x="536" y="582" fill="#8e8f9a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2">06 / PERSONALIZATION</text><text x="536" y="627" fill="#ededf2" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" >Make it feel like you.</text><text x="536" y="665" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >Pick a theme, tune the accents</text><text x="536" y="691" fill="#a0a1ac" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" >and rearrange your dashboard.</text><text x="536" y="740" fill="#787a88" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" >Theme presets · Custom colors · Tile layouts</text></svg>
