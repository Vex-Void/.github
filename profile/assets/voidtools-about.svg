<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="One app. A lot of possibilities. System tools, everyday essentials and entertainment. Custom themes, colors and dashboard."><rect x="1" y="1" width="488" height="278" rx="30" fill="#1b1c21" stroke="#303138"/><rect x="511" y="1" width="488" height="278" rx="30" fill="#131418" stroke="#292a30"/><text x="32" y="39" fill="#90919c" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5">BEHIND THE TOOLS</text><text x="32" y="91" fill="#f0f0f3" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="650" >One app.</text><text x="32" y="130" fill="#f0f0f3" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="650" >A lot of possibilities.</text><text x="32" y="174" fill="#a1a1ad" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" >System tools, everyday essentials</text><text x="32" y="202" fill="#a1a1ad" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" >and entertainment. In your corner.</text><text x="32" y="250" fill="#d0d0d9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" >Less switching. More doing.</text><text x="542" y="39" fill="#90919c" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5">DESIGNED AROUND YOU</text><text x="542" y="91" fill="#f0f0f3" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="650" >Your tools. Your space.</text><text x="542" y="132" fill="#a1a1ad" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" >Deep blacks. Soft borders.</text><text x="542" y="160" fill="#a1a1ad" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" >A dashboard that feels like yours.</text><rect x="542" y="190" width="112" height="38" rx="10" fill="#212228" stroke="#3a3b43"/><text x="560" y="215" fill="#d0d0d9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" >Themes</text><rect x="664" y="190" width="138" height="38" rx="10" fill="#212228" stroke="#3a3b43"/><text x="682" y="215" fill="#d0d0d9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" >Custom colors</text><text x="542" y="256" fill="#797b88" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" >C++20 / React / TypeScript / WebView2</text></svg>
